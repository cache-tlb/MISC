<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 250" width="700" height="250"
     font-family="system-ui,-apple-system,Segoe UI,Helvetica,sans-serif" font-size="13">
  <style>
    .win  { fill:none; stroke:#9aa0aa; stroke-dasharray:5 4; stroke-width:1.4 }
    .ink  { fill:#9aa0aa; opacity:.25 }
    .up   { stroke:#3b82f6; stroke-width:2.6 }
    .dn   { stroke:#f97316; stroke-width:2.6 }
    .t    { fill:#808a99 }
    .vb   { fill:#3b82f6; font-size:15px; font-weight:600 }
    .vo   { fill:#f97316; font-size:15px; font-weight:600 }
    .vg   { fill:#10b981; font-size:15px; font-weight:600 }
  </style>

  <!-- ============ Panel 1: upward edge, + ============ -->
  <text class="t" x="120" y="30" text-anchor="middle">① 上行边 → 记正号</text>
  <rect x="75"  y="70" width="135" height="110" fill="#3b82f6" opacity=".18"/>
  <rect x="75"  y="70" width="60"  height="110" class="ink"/>
  <rect x="30"  y="70" width="180" height="110" class="win"/>
  <line x1="75"  y1="58" x2="75"  y2="192" class="up"/>
  <polygon points="70,60 75,48 80,60" fill="#3b82f6"/>
  <line x1="135" y1="58" x2="135" y2="192" class="dn"/>
  <polygon points="130,180 135,192 140,180" fill="#f97316"/>
  <text class="vb" x="152" y="130" text-anchor="middle">+135·h</text>
  <text class="t" x="120" y="212" text-anchor="middle">其右侧的窗口面积</text>

  <!-- ============ Panel 2: downward edge, - ============ -->
  <text class="t" x="350" y="30" text-anchor="middle">② 下行边 → 记负号</text>
  <rect x="365" y="70" width="75"  height="110" fill="#f97316" opacity=".18"/>
  <rect x="305" y="70" width="60"  height="110" class="ink"/>
  <rect x="260" y="70" width="180" height="110" class="win"/>
  <line x1="305" y1="58" x2="305" y2="192" class="up"/>
  <polygon points="300,60 305,48 310,60" fill="#3b82f6"/>
  <line x1="365" y1="58" x2="365" y2="192" class="dn"/>
  <polygon points="360,180 365,192 370,180" fill="#f97316"/>
  <text class="vo" x="403" y="130" text-anchor="middle">−75·h</text>
  <text class="t" x="350" y="212" text-anchor="middle">其右侧的窗口面积</text>

  <!-- ============ Panel 3: sum ============ -->
  <text class="t" x="580" y="30" text-anchor="middle">③ 求和 = 窗口内的墨水</text>
  <rect x="535" y="70" width="60"  height="110" fill="#10b981" opacity=".28"/>
  <rect x="490" y="70" width="180" height="110" class="win"/>
  <line x1="535" y1="58" x2="535" y2="192" class="up"/>
  <polygon points="530,60 535,48 540,60" fill="#3b82f6"/>
  <line x1="595" y1="58" x2="595" y2="192" class="dn"/>
  <polygon points="590,180 595,192 600,180" fill="#f97316"/>
  <text class="vg" x="565" y="130" text-anchor="middle">60·h</text>
  <text class="t" x="580" y="212" text-anchor="middle">恰好是笔画宽度</text>

  <text class="t" x="350" y="238" text-anchor="middle" font-size="14">
    覆盖率 = (135 − 75)·h ⁄ (180·h) = 1/3，无需任何采样点
  </text>
</svg>
