<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 250" width="660" height="250"
     font-family="system-ui,-apple-system,Segoe UI,Helvetica,sans-serif" font-size="13">
  <style>
    .t    { fill:#808a99 }
    .scan { stroke:#9aa0aa; stroke-width:1.2; stroke-dasharray:4 4 }
    .cv   { fill:none; stroke:#3b82f6; stroke-width:2.6 }
    .cv2  { fill:none; stroke:#10b981; stroke-width:2.6 }
    .box  { fill:none; stroke:#9aa0aa; stroke-dasharray:5 4; stroke-width:1.3 }
    .bad  { fill:none; stroke:#ef4444; stroke-width:2; stroke-dasharray:5 4 }
    .hit  { fill:#ef4444 }
    .ok   { fill:#10b981 }
  </style>

  <!-- ================= left: not monotonic ================= -->
  <text class="t" x="150" y="28" text-anchor="middle">未单调化：一条扫描线上有两个根</text>
  <line class="scan" x1="40" y1="160" x2="260" y2="160"/>
  <text class="t" x="150" y="152" text-anchor="middle">扫描线</text>
  <path class="cv" d="M60,190 Q150,50 240,190"/>
  <!-- two intersections -->
  <circle class="hit" cx="82"  cy="160" r="4.5"/>
  <circle class="hit" cx="218" cy="160" r="4.5"/>
  <!-- degenerate endpoint AABB -->
  <line class="bad" x1="60" y1="190" x2="240" y2="190"/>
  <circle cx="60"  cy="190" r="3.5" fill="#3b82f6"/>
  <circle cx="240" cy="190" r="3.5" fill="#3b82f6"/>
  <text class="t" x="150" y="212" text-anchor="middle" fill="#ef4444">端点包围盒退化，框不住曲线</text>

  <!-- ================= right: monotonic ================= -->
  <text class="t" x="480" y="28" text-anchor="middle">在极值点切开：每段一个根</text>
  <line class="scan" x1="370" y1="160" x2="590" y2="160"/>
  <!-- tight AABBs -->
  <rect class="box" x="390" y="120" width="90" height="70"/>
  <rect class="box" x="480" y="120" width="90" height="70"/>
  <path class="cv"  d="M390,190 Q435,120 480,120"/>
  <path class="cv2" d="M480,120 Q525,120 570,190"/>
  <circle class="ok" cx="412" cy="160" r="4.5"/>
  <circle class="ok" cx="548" cy="160" r="4.5"/>
  <circle cx="480" cy="120" r="4" fill="#f97316"/>
  <text class="t" x="480" y="112" text-anchor="middle" fill="#f97316">t*</text>
  <text class="t" x="480" y="212" text-anchor="middle" fill="#10b981">端点包围盒即紧包围盒</text>
</svg>
