<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 286" width="740" height="286" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,PingFang SC,Microsoft YaHei,Helvetica,Arial,sans-serif"><title>Willmore bound</title><rect width="740" height="286" fill="#fbfbfd"/><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1c2033"/></marker><marker id="arD" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#e07a1f"/></marker><marker id="arR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#c2405a"/></marker><marker id="arG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1f9d6d"/></marker></defs><g transform="translate(18,14)"><text x="165" y="18" font-size="12.5" fill="#1c2033" text-anchor="middle" font-weight="600">沿任意方向 u 的"最外点"</text><path d="M62 176 C 30 124, 62 62, 132 52 C 212 40, 288 84, 283 139 C 279 189, 212 219, 152 209 C 107 201, 80 201, 62 176 z" fill="#ffffff" stroke="#1c2033" stroke-width="2"/><path d="M36 50 L300 36" fill="none" stroke="#1f9d6d" stroke-width="1.8" stroke-dasharray="6 4"/><circle cx="133" cy="50" r="5" fill="#1f9d6d" stroke="none" stroke-width="1.5"/><path d="M133 48 L133 12" fill="none" stroke="#1f9d6d" stroke-width="1.8" marker-end="url(#arG)"/><text x="142" y="20" font-size="14" fill="#1f9d6d" font-style="italic">u</text><text x="133" y="74" font-size="14" fill="#1c2033" text-anchor="middle" font-style="italic">p</text><text x="165" y="244" font-size="11.5" fill="#6b7290" text-anchor="middle">曲面整体落在切平面一侧 ⟹ κ₁、κ₂ 同号</text><text x="165" y="262" font-size="11.5" fill="#6b7290" text-anchor="middle">⟹ K ≥ 0，而且那里的法向恰好就是 u</text></g><g transform="translate(378,14)"><rect x="0" y="26" width="344" height="206" rx="8" fill="#ffffff" stroke="#dde1ec" stroke-width="1.4"/><text x="172" y="18" font-size="12.5" fill="#1c2033" text-anchor="middle" font-weight="600">三步推出 W ≥ 4π</text><text x="18" y="62" font-size="12.5" fill="#1c2033">① H² − K = ((κ₁−κ₂)/2)² ≥ 0</text><text x="18" y="94" font-size="12.5" fill="#1c2033">② 高斯映射把 {K ≥ 0} 至少铺满 S² 一次</text><text x="18" y="126" font-size="12.5" fill="#1c2033">③ |K| 正是高斯映射的雅可比行列式</text><path d="M18 144 L326 144" fill="none" stroke="#dde1ec" stroke-width="1"/><text x="18" y="174" font-size="13.5" fill="#e07a1f" font-weight="600">W = ∫H² ≥ ∫₍K≥0₎K ≥ |S²| = 4π</text><text x="18" y="206" font-size="11.5" fill="#6b7290">取等 ⟺ 处处 κ₁ = κ₂ ⟺ 正圆球</text></g><text x="370" y="280" font-size="11.5" fill="#6b7290" text-anchor="middle">图 4　Willmore 不等式 W ≥ 4π 的证明骨架</text></svg>