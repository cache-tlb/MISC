<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 278" width="730" height="278" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,PingFang SC,Microsoft YaHei,Helvetica,Arial,sans-serif"><title>first variation of area</title><rect width="730" height="278" fill="#fbfbfd"/><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1c2033"/></marker><marker id="arD" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#e07a1f"/></marker><marker id="arR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#c2405a"/></marker><marker id="arG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1f9d6d"/></marker></defs><g transform="translate(24,12)"><circle cx="140" cy="128" r="76" fill="none" stroke="#1c2033" stroke-width="2.2"/><circle cx="140" cy="128" r="93" fill="none" stroke="#e07a1f" stroke-width="2" stroke-dasharray="6 4"/><path d="M216.0 128.0 L230.0 128.0" fill="none" stroke="#e07a1f" stroke-width="1.3" marker-end="url(#arD)"/><path d="M208.5 161.0 L221.1 167.0" fill="none" stroke="#e07a1f" stroke-width="1.3" marker-end="url(#arD)"/><path d="M187.4 187.4 L196.1 198.4" fill="none" stroke="#e07a1f" stroke-width="1.3" marker-end="url(#arD)"/><path d="M156.9 202.1 L160.0 215.7" fill="none" stroke="#e07a1f" stroke-width="1.3" marker-end="url(#arD)"/><path d="M123.1 202.1 L120.0 215.7" fill="none" stroke="#e07a1f" stroke-width="1.3" marker-end="url(#arD)"/><path d="M92.6 187.4 L83.9 198.4" fill="none" stroke="#e07a1f" stroke-width="1.3" marker-end="url(#arD)"/><path d="M71.5 161.0 L58.9 167.0" fill="none" stroke="#e07a1f" stroke-width="1.3" marker-end="url(#arD)"/><path d="M64.0 128.0 L50.0 128.0" fill="none" stroke="#e07a1f" stroke-width="1.3" marker-end="url(#arD)"/><path d="M71.5 95.0 L58.9 89.0" fill="none" stroke="#e07a1f" stroke-width="1.3" marker-end="url(#arD)"/><path d="M92.6 68.6 L83.9 57.6" fill="none" stroke="#e07a1f" stroke-width="1.3" marker-end="url(#arD)"/><path d="M123.1 53.9 L120.0 40.3" fill="none" stroke="#e07a1f" stroke-width="1.3" marker-end="url(#arD)"/><path d="M156.9 53.9 L160.0 40.3" fill="none" stroke="#e07a1f" stroke-width="1.3" marker-end="url(#arD)"/><path d="M187.4 68.6 L196.1 57.6" fill="none" stroke="#e07a1f" stroke-width="1.3" marker-end="url(#arD)"/><path d="M208.5 95.0 L221.1 89.0" fill="none" stroke="#e07a1f" stroke-width="1.3" marker-end="url(#arD)"/><path d="M140 128 L194.0 74.0" fill="none" stroke="#6b7290" stroke-width="1.2"/><text x="162" y="106" font-size="13" fill="#6b7290" font-style="italic">R</text><text x="140" y="20" font-size="12.5" fill="#1c2033" text-anchor="middle" font-weight="600">球面沿法向外推 φ</text><text x="140" y="244" font-size="11.5" fill="#6b7290" text-anchor="middle">4π(R+φ)² − 4πR² = 2·(1/R)·φ·(4πR²)</text></g><g transform="translate(340,12)"><rect x="0" y="26" width="366" height="192" rx="8" fill="#ffffff" stroke="#dde1ec" stroke-width="1.4"/><text x="183" y="20" font-size="12.5" fill="#1c2033" text-anchor="middle" font-weight="600">一般曲面：只有法向分量改变面积</text><text x="22" y="66" font-size="17" fill="#1c2033">δ(dA) = 2H φ dA</text><text x="22" y="96" font-size="11.5" fill="#6b7290">H = (κ₁+κ₂)/2 是平均曲率，两个主曲率的平均。</text><text x="22" y="124" font-size="12" fill="#1c2033">反过来读：面积对形状的梯度 = 2H × 法向。</text><path d="M22 140 L344 140" fill="none" stroke="#dde1ec" stroke-width="1"/><text x="22" y="166" font-size="12" fill="#e07a1f" font-weight="600">离散化时这一条就是全部的钥匙 ——</text><text x="22" y="188" font-size="12" fill="#e07a1f" font-weight="600">把"面积的梯度"算出来，就等于把曲率算出来。</text></g><text x="365" y="270" font-size="11.5" fill="#6b7290" text-anchor="middle">图 3　面积的第一变分</text></svg>