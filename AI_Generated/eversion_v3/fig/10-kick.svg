<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 290" width="740" height="290" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,PingFang SC,Microsoft YaHei,Helvetica,Arial,sans-serif"><title>unstable mode</title><rect width="740" height="290" fill="#fbfbfd"/><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1c2033"/></marker><marker id="arD" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#e07a1f"/></marker><marker id="arR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#c2405a"/></marker><marker id="arG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1f9d6d"/></marker></defs><g transform="translate(30,16)"><text x="150" y="18" font-size="12.5" fill="#1c2033" text-anchor="middle" font-weight="600">φ = x² − y² 在四只碗上的符号</text><circle cx="150" cy="146" r="116" fill="none" stroke="#dde1ec" stroke-width="1.2" stroke-dasharray="4 4"/><circle cx="212" cy="146" r="34" fill="#fdf0e0" stroke="#e07a1f" stroke-width="2"/><text x="212" y="154" font-size="24" fill="#e07a1f" text-anchor="middle" font-weight="700">+</text><circle cx="150" cy="208" r="34" fill="#e4f1f7" stroke="#2b8fb3" stroke-width="2"/><text x="150" y="216" font-size="24" fill="#2b8fb3" text-anchor="middle" font-weight="700">−</text><circle cx="88" cy="146" r="34" fill="#fdf0e0" stroke="#e07a1f" stroke-width="2"/><text x="88" y="154" font-size="24" fill="#e07a1f" text-anchor="middle" font-weight="700">+</text><circle cx="150" cy="84" r="34" fill="#e4f1f7" stroke="#2b8fb3" stroke-width="2"/><text x="150" y="92" font-size="24" fill="#2b8fb3" text-anchor="middle" font-weight="700">−</text><circle cx="150" cy="146" r="4" fill="#1c2033" stroke="none" stroke-width="1.5"/><text x="158" y="138" font-size="10.5" fill="#6b7290">四重点</text><text x="150" y="272" font-size="11.5" fill="#6b7290" text-anchor="middle">x 方向的碗胀大，y 方向的碗收缩</text></g><g transform="translate(348,16)"><rect x="0" y="30" width="362" height="192" rx="8" fill="#ffffff" stroke="#dde1ec" stroke-width="1.4"/><text x="181" y="20" font-size="12.5" fill="#1c2033" text-anchor="middle" font-weight="600">为什么必须是"奇"的</text><text x="18" y="64" font-size="11.5" fill="#1c2033">ρ₄ 是 90° 旋转，但它交换曲面的两面，</text><text x="18" y="84" font-size="11.5" fill="#1c2033">所以法向也翻号：n(ρ₄p) = −ρ₄n(p)。</text><text x="18" y="116" font-size="12" fill="#1c2033">扰动 V = φ·n 与对称性相容</text><text x="18" y="142" font-size="15" fill="#e07a1f" font-weight="600">⟺　φ(ρ₄p) = −φ(p)</text><path d="M18 158 L344 158" fill="none" stroke="#dde1ec" stroke-width="1"/><text x="18" y="182" font-size="11.5" fill="#1c2033">而 (−y)² − x² = −(x² − y²)，正好满足。</text><text x="18" y="206" font-size="11" fill="#6b7290">论文说：强制 4 重对称时半程模型是极小 ——</text><text x="18" y="222" font-size="11" fill="#6b7290">不稳定方向只能藏在这个"奇"的子空间里。</text></g><text x="370" y="284" font-size="11.5" fill="#6b7290" text-anchor="middle">图 10　把曲面从鞍点上推下去的那一脚</text></svg>