<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 280" width="760" height="280" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,PingFang SC,Microsoft YaHei,Helvetica,Arial,sans-serif"><title>temporal symmetry</title><rect width="760" height="280" fill="#fbfbfd"/><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1c2033"/></marker><marker id="arD" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#e07a1f"/></marker><marker id="arR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#c2405a"/></marker><marker id="arG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1f9d6d"/></marker></defs><path d="M70 120 L690 120" fill="none" stroke="#c3c9da" stroke-width="1.6"/><path d="M70 113 L70 127" fill="none" stroke="#6b7290" stroke-width="1.6"/><text x="70" y="148" font-size="12" fill="#6b7290" text-anchor="middle">t = −1</text><path d="M380 113 L380 127" fill="none" stroke="#6b7290" stroke-width="1.6"/><text x="380" y="148" font-size="12" fill="#6b7290" text-anchor="middle">t = 0</text><path d="M690 113 L690 127" fill="none" stroke="#6b7290" stroke-width="1.6"/><text x="690" y="148" font-size="12" fill="#6b7290" text-anchor="middle">t = +1</text><rect x="380" y="68" width="310" height="44" rx="7" fill="#e6f4ee" stroke="#1f9d6d" stroke-width="1.5"/><text x="535" y="96" font-size="12" fill="#1f9d6d" text-anchor="middle" font-weight="600">真正算出来的一半（梯度流）</text><rect x="70" y="68" width="310" height="44" rx="7" fill="#fdf0e0" stroke="#e07a1f" stroke-width="1.5" stroke-dasharray="6 4"/><text x="225" y="96" font-size="12" fill="#e07a1f" text-anchor="middle" font-weight="600">由对称性免费生成</text><path d="M364 50 Q 380 16, 396 50" fill="none" stroke="#1c2033" stroke-width="1.6"/><path d="M396 50 L364 50" fill="none" stroke="none" stroke-width="1.6"/><text x="380" y="8" font-size="12.5" fill="#1c2033" text-anchor="middle" font-weight="600">绕对称轴转 90°，再交换内外颜色</text><text x="380" y="190" font-size="16" fill="#1c2033" text-anchor="middle">h₋ₜ(w) = ρ₄ ( hₜ(σ⁻¹w) )　，　σ(w) = i / w̄</text><text x="380" y="220" font-size="11.5" fill="#6b7290" text-anchor="middle">σ 是反全纯的 ⟹ 反转参数定向 ⟹ 两端的圆球定向相反 ⟹ 确实翻了过来</text><circle cx="70" cy="120" r="9" fill="#e07a1f" stroke="none" stroke-width="1.5"/><circle cx="690" cy="120" r="9" fill="#7a5cf0" stroke="none" stroke-width="1.5"/><text x="380" y="270" font-size="11.5" fill="#6b7290" text-anchor="middle">图 11　只算一半：另一半由半程模型的 4 重反定向对称直接给出</text></svg>