<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 306" width="740" height="306" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,PingFang SC,Microsoft YaHei,Helvetica,Arial,sans-serif"><title>inversion</title><rect width="740" height="306" fill="#fbfbfd"/><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1c2033"/></marker><marker id="arD" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#e07a1f"/></marker><marker id="arR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#c2405a"/></marker><marker id="arG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1f9d6d"/></marker></defs><g transform="translate(18,18)"><text x="160" y="16" font-size="12.5" fill="#1c2033" text-anchor="middle" font-weight="600">M̃：四个平面端伸向无穷远</text><path d="M169.9 283.1 L245.6 38.5" fill="none" stroke="#2b8fb3" stroke-width="2.4"/><path d="M22.9 156.0 L267.6 231.5" fill="none" stroke="#e07a1f" stroke-width="2.4"/><path d="M149.8 9.0 L74.6 253.6" fill="none" stroke="#7a5cf0" stroke-width="2.4"/><path d="M297.0 135.7 L52.3 60.7" fill="none" stroke="#1f9d6d" stroke-width="2.4"/><circle cx="160" cy="146" r="4.5" fill="#6b7290" stroke="none" stroke-width="1.5"/><text x="146" y="152" font-size="13" fill="#6b7290" font-style="italic">c</text></g><path d="M356 158 L412 158" fill="none" stroke="#1c2033" stroke-width="2" marker-end="url(#ar)"/><text x="384" y="146" font-size="12" fill="#1c2033" text-anchor="middle" font-weight="600">反演</text><text x="384" y="186" font-size="10.5" fill="#6b7290" text-anchor="middle">x ↦ c + (x−c)/|x−c|²</text><text x="384" y="204" font-size="10.5" fill="#6b7290" text-anchor="middle">把 ∞ 送到 c</text><