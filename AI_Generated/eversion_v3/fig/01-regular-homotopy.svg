<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 252" width="730" height="252" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,PingFang SC,Microsoft YaHei,Helvetica,Arial,sans-serif"><title>regular homotopy</title><rect width="730" height="252" fill="#fbfbfd"/><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1c2033"/></marker><marker id="arD" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#e07a1f"/></marker><marker id="arR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#c2405a"/></marker><marker id="arG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1f9d6d"/></marker></defs><g transform="translate(0,0)"><rect x="10" y="34" width="210" height="152" rx="8" fill="#ffffff" stroke="#dde1ec" stroke-width="1.4"/><text x="115" y="24" font-size="13" fill="#1f9d6d" text-anchor="middle" font-weight="600">允许：横截自交</text><path d="M40 152 C 80 62, 150 62, 190 152" fill="none" stroke="#e07a1f" stroke-width="2.6"/><path d="M190 92 C 150 172, 80 172, 40 92" fill="none" stroke="#2b8fb3" stroke-width="2.6"/><text x="115" y="208" font-size="11.5" fill="#6b7290" text-anchor="middle">曲面可以穿过自己</text></g><g transform="translate(245,0)"><rect x="10" y="34" width="210" height="152" rx="8" fill="#ffffff" stroke="#dde1ec" stroke-width="1.4"/><text x="115" y="24" font-size="13" fill="#c2405a" text-anchor="middle" font-weight="600">禁止：尖点 / 折痕</text><path d="M45 158 C 95 158, 110 74, 115 108 C 120 74, 135 158, 185 158" fill="none" stroke="#c2405a" stroke-width="2.6"/><circle cx="115" cy="100" r="5" fill="none" stroke="#c2405a" stroke-width="2"/><text x="115" y="208" font-size="11.5" fill="#6b7290" text-anchor="middle">曲率在一点变成无穷大</text></g><g transform="translate(487,0)"><rect x="10" y="34" width="228" height="152" rx="8" fill="#ffffff" stroke="#dde1ec" stroke-width="1.4"/><text x="124" y="24" font-size="13" fill="#1c2033" text-anchor="middle" font-weight="600">判据：全程都是浸入</text><text x="28" y="68" font-size="11.5" fill="#1c2033">形变过程中每一时刻、每一点，</text><text x="28" y="88" font-size="11.5" fill="#1c2033">切平面都必须存在且不退化：</text><text x="124" y="126" font-size="16" fill="#1c2033" text-anchor="middle" font-style="italic">x_u × x_v ≠ 0</text><text x="28" y="158" font-size="11.5" fill="#6b7290">这排除了"速度归零"的折痕，</text><text x="28" y="176" font-size="11.5" fill="#6b7290">但完全不禁止自交。</text></g><text x="365" y="242" font-size="11.5" fill="#6b7290" text-anchor="middle">图 1　正则同伦允许什么、禁止什么</text></svg>